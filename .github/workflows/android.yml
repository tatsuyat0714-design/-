name: Build Android APK

on:
  push:
    branches: [claude/hyperdimensional-soccer-game-7c3hwa]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      # Android SDK はランナーにインストール済み（ANDROID_HOME）
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk chojigen-soccer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chojigen-soccer-apk
          path: chojigen-soccer.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 超次元サッカー v1.0.${{ github.run_number }}
          body: |
            Android 用アプリ（APK）です。下の **chojigen-soccer.apk** をスマホでダウンロードしてインストールしてください。
            インターネット接続なしで遊べます。
          files: chojigen-soccer.apk
          make_latest: true
